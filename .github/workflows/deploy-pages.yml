# Builds the app and publishes it on GitHub Pages (https://<user>.github.io/<repo>/).
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# After that every push to the default branch is tested, built and deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment half-way; let the newest one win afterwards.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch is published.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_path is "/<repo>" for https://<user>.github.io/<repo>/ and "" for a custom domain.
      - name: Build
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/hvor-er-den/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
